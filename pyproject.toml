[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pratyabhijna"
version = "0.19.3"
description = "Pratyabhijna memory system — MCP server for persistent semantic memory"
requires-python = ">=3.10,<4"
dependencies = [
    "aiosqlite>=0.20",
    "graphiti-core[anthropic]>=0.28.2,<0.29",
    "neo4j>=5.26.0",
    "voyageai>=0.2.3",
    "mcp>=1.9.4",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pratyabhijna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "focus: mark test to run when --focus is used",
]
filterwarnings = [
    # graphiti-core 0.28.x uses class-based Pydantic config (their migration, not ours)
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:graphiti_core",
]
