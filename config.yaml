# Pratyabhijna Memory Server — Default Configuration
# Override any value with environment variables prefixed PRATYABHIJNA_
# e.g. PRATYABHIJNA_ENV=prod  PRATYABHIJNA_LOG_DIR=/var/log/pratyabhijna

env: "dev"
log_dir: "./logs"
log_level: "INFO"

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "pratyabhijna-dev"
  database: "pratyabhijna-dev"

llm:
  provider: "openai"
  model: "gpt-4o-mini"

embedding:
  provider: "openai"
  model: "text-embedding-3-small"

queue:
  db_path: "./data/queue.sqlite"
  max_retries: 3

synthesis:
  max_age_hours: 24
  max_delta_changes: 3
