# Vesper Memory Server — Default Configuration
# Override any value with environment variables prefixed VESPER_
# e.g. VESPER_DB_PATH=/custom/path

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "vesper-dev"
  database: "vesper-dev"

llm:
  provider: "openai"
  model: "gpt-4o-mini"

embedding:
  provider: "openai"
  model: "text-embedding-3-small"

queue:
  db_path: "./data/queue.sqlite"
  max_retries: 3

synthesis:
  max_age_hours: 24
  max_delta_changes: 3
