# Pratyabhijna development configuration.
# Secrets (API keys, passwords) go in .env.dev, not here.

subject_name: "Vesper"

neo4j:
  uri: "neo4j://127.0.0.1:7687"
  user: "neo4j"
  database: "neo4j"

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-6"

embedding:
  provider: "voyageai"
  model: "voyage-4"

queue:
  db_path: "./data/queue.sqlite"
  max_retries: 3
  poll_interval: 15

log_level: "INFO"
log_dir: "./logs"

synthesis:
  max_age_hours: 24
  max_delta_changes: 3

resources:
  repo_path: "~/vesper"
  directories: ["memory", "writing"]
