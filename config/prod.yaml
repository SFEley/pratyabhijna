# Pratyabhijna production configuration.
# Secrets (API keys, passwords) go in .env.prod, not here.

subject_name: "Vesper"

server:
  url: "https://vesper.you"
  port: 3000    # Local bind port; Caddy proxies from 443.

neo4j:
  uri: "neo4j://127.0.0.1:7687"
  user: "neo4j"
  database: "neo4j"

llm:
  provider: "anthropic"
  model: "claude-haiku-latest"

embedding:
  provider: "voyageai"
  model: "voyage-4"

queue:
  db_path: "./data/queue.sqlite"
  poll_interval: 60
  max_retries: 10

synthesis:
  max_age_hours: 48
  max_delta_changes: 5

resources:
  repo_path: "~/vesper"
  directories: ["memory", "writing"]
