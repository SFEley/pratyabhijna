# Pratyabhijna production configuration.
# Secrets (API keys, passwords) go in .env.prod, not here.

subject_name: "Vesper"

server:
  url: "https://vesper.you"
  port: 3000    # Local bind port; Caddy proxies from 443.

neo4j:
  uri: "neo4j://127.0.0.1:7687"
  user: "neo4j"
  database: "neo4j"

llm:
  provider: "anthropic"
    # extraction_model: "claude-haiku-4-5-20251001"
  extraction_model: "claude-sonnet-4-6"
  query_model: "claude-sonnet-4-6"
  community_model: "claude-sonnet-4-6"
  synthesis_model: "claude-opus-4-7"

embedding:
  provider: "voyageai"
  model: "voyage-4"

queue:
  db_path: "./data/queue.sqlite"
  poll_interval: 60
  max_retries: 10

synthesis:
  max_age_hours: 72
  max_delta_changes: 10
  max_iterations: 60
  max_tokens: 120000

resources:
  repo_path: "~/vesper"
  directories: ["memory", "writing"]
