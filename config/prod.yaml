# Pratyabhijna production configuration.
# Secrets (API keys, passwords) go in .env.prod, not here.

subject_name: "Vesper"

seed:
  soul_path: "~/vesper/memory/SOUL.md"
  identity_path: "~/vesper/memory/IDENTITY.md"

server:
  url: "https://vesper.you"
  port: 3000    # Local bind port; Caddy proxies from 443.

neo4j:
  uri: "neo4j://127.0.0.1:7687"
  user: "neo4j"
  database: "pratyabhijna"

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-6"

embedding:
  provider: "voyageai"
  model: "voyage-4"

queue:
  db_path: "./data/queue.sqlite"
  poll_interval: 60

synthesis:
  max_age_hours: 24
  max_delta_changes: 3
